[package]
name = "avenir"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = []

[dependencies.hashbrown]
default-features = false
version = "0.17"

[dependencies.nohash-hasher]
default-features = false
version = "0.2"

[dependencies.crossbeam-queue]
default-features = false
features = ["alloc"]
version = "0.3"

[dependencies.futures]
default-features = false
features = ["alloc"]
version = "0.3"

[dependencies.pin-project-lite]
default-features = false
version = "0.2"

[build-dependencies]
rustc_version = "0.4"
